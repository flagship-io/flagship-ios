name: Swift
on:
  pull_request:
  push:
    branches:
      - master
jobs:
  Build_SDK:
    runs-on: macos-latest
    strategy:
      matrix:
        run-config:
          # Generic destinations don't depend on a specific simulator being installed on the runner
          - { scheme: 'Flagship', destination: 'generic/platform=iOS Simulator', label: 'iOS'}
          - { scheme: 'Flagship-tvOS', destination: 'generic/platform=tvOS Simulator', label: 'tvOS' }
          - { scheme: 'Flagship-macOS', destination: 'platform=macOS', label: 'macOS'}
          - { scheme: 'Flagship-watchOS', destination: 'generic/platform=watchOS Simulator', label: 'watchOS'}

    steps:
    - name: Checkout Project
      uses: actions/checkout@v4
    - name: Building SDK for ${{ matrix.run-config['label'] }}
      run: xcodebuild clean build -project Flagship/Flagship.xcodeproj -scheme '${{ matrix.run-config['scheme'] }}'  -destination '${{ matrix.run-config['destination'] }}'
  Testing:
     needs: Build_SDK
     runs-on: macos-latest
     steps:
     - name: Checkout Project
       uses: actions/checkout@v4
     - name: Pick an available iPhone simulator
       id: sim
       run: |
         # Pick the first available iPhone on the newest installed iOS runtime
         UDID=$(xcrun simctl list devices available -j | jq -r '
           .devices | to_entries
           | map(select(.key | test("SimRuntime\\.iOS-")))
           | sort_by(.key | capture("iOS-(?<v>[0-9-]+)").v | split("-") | map(tonumber))
           | reverse
           | map(.value[] | select(.name | startswith("iPhone")))
           | .[0].udid // empty')
         if [ -z "$UDID" ]; then
           echo "No iPhone simulator available on this runner"
           xcrun simctl list devices available
           exit 1
         fi
         echo "Using simulator: $(xcrun simctl list devices | grep "$UDID")"
         echo "udid=$UDID" >> "$GITHUB_OUTPUT"
     - name: Test SDK Flagship
       run:  xcodebuild test -project Flagship/Flagship.xcodeproj -scheme "Flagship" -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" -enableCodeCoverage YES
     - name: Upload coverage to Codecov
       uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8fd56d24
       with:
          token: ${{ secrets.CODECOV_TOKEN }}
